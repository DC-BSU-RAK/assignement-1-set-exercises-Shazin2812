<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded Video</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0;
    }
    video {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
  
</head>
<body>
  
  <video 
    src="WhatsApp Video 2025-04-14 at 9.27.05 AM.mp4" 
    poster="WhatsApp Image 2024-12-11 at 11.52.05 AM.jpeg" 
    loop 
    autoplay 
    muted 
    controls>
    Your browser does not support the video tag.
  </video>
  
</body>
</html>
